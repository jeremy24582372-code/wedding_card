name: Deploy wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare website and sharing metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import re
          base = os.environ["PAGES_BASE_URL"].rstrip("/")
          path = Path("_site/index.html")
          page = path.read_text(encoding="utf-8")
          for prop, url in {"og:url": base + "/", "og:image": base + "/assets/original-cover.jpeg"}.items():
              pattern = r'(<meta\s+property="' + re.escape(prop) + r'"\s+content=")[^"]*'
              page, count = re.subn(pattern, lambda m: m.group(1) + html.escape(url, quote=True), page, count=1)
              if count != 1:
                  raise SystemExit(f"Missing {prop}")
          path.write_text(page, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
